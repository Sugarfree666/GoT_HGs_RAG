dataset:
  root: datasets/hotpotqa

runtime:
  base_run_dir: runs/depo_hyperbranch/hotpotqa
  log_level: INFO

retrieval:
  local_hyperedge_top_k: 50
  local_hyperedge_hops: 2

llm:
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  model: gpt-4o-mini
  embedding_model: text-embedding-3-small

  timeout_seconds: 120
  temperature: 0

prompts:
  dir: prompts
