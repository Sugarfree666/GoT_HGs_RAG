dataset:
  root: datasets/musique

runtime:
  base_run_dir: runs/depo_hyperbranch/musique
  log_level: INFO

retrieval:
  local_hyperedge_top_k: 20
  local_hyperedge_hops: 2

llm:
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  model: gpt-4o-mini
  embedding_model: text-embedding-3-small

  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2.0
  temperature: 0
  use_mock: false

prompts:
  dir: prompts
