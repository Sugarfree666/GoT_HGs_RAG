dataset:
  root: datasets/agriculture

runtime:
  base_run_dir: runs
  log_level: INFO

retrieval:
  relation_top_k: 10
  semantic_top_k: 10
  evidence_top_k: 5
  max_anchor_hyperedges_per_entity: null
  anchor_weight: 0.4
  relation_weight: 0.4
  semantic_weight: 0.2

llm:
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  model: gpt-4o-mini
  embedding_model: text-embedding-3-small
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2.0
  temperature: 0.1
  use_mock: false

prompts:
  dir: prompts
